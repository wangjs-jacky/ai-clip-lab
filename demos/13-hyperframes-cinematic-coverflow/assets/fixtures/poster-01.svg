<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Echo North</title>
  <desc id="desc">A neon signal radiates from a luminous northern compass.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="43%" r="50%">
      <stop offset="0" stop-color="#d7ff43" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#21ff8f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07110d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#b7ffd2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="900" fill="#07110d"/>
  <rect width="600" height="900" fill="url(#grid)"/>
  <circle cx="300" cy="372" r="270" fill="url(#halo)"/>
  <g fill="none" stroke="#3cff9a" stroke-width="2">
    <circle cx="300" cy="360" r="66"/>
    <circle cx="300" cy="360" r="112" stroke-opacity=".62"/>
    <circle cx="300" cy="360" r="164" stroke-opacity=".34"/>
    <circle cx="300" cy="360" r="224" stroke-opacity=".16"/>
  </g>
  <g transform="translate(300 360)" fill="none" stroke="#d7ff43" stroke-width="8">
    <ellipse rx="44" ry="146"/>
    <ellipse rx="44" ry="146" transform="rotate(45)"/>
    <ellipse rx="44" ry="146" transform="rotate(90)"/>
    <ellipse rx="44" ry="146" transform="rotate(135)"/>
  </g>
  <circle cx="300" cy="360" r="26" fill="#d7ff43"/>
  <circle cx="300" cy="360" r="8" fill="#07110d"/>
  <g fill="#d7ff43">
    <circle cx="300" cy="83" r="4"/><circle cx="545" cy="360" r="4"/>
    <circle cx="300" cy="637" r="4"/><circle cx="55" cy="360" r="4"/>
  </g>
  <path d="M48 680H552" stroke="#d7ff43" stroke-opacity=".28"/>
  <text x="48" y="62" fill="#d7ff43" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="3">PARALLAX / 01</text>
  <text x="552" y="62" text-anchor="end" fill="#8aa696" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">MOTION STUDIES 24</text>
  <text x="48" y="748" fill="#f2fff7" font-family="'Cabinet Grotesk', sans-serif" font-size="66" font-weight="700" letter-spacing="-2">ECHO</text>
  <text x="48" y="809" fill="#3cff9a" font-family="'Cabinet Grotesk', sans-serif" font-size="66" font-weight="700" letter-spacing="-2">NORTH</text>
  <text x="50" y="850" fill="#8aa696" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">A SIGNAL FINDS TRUE NORTH</text>
  <text x="550" y="850" text-anchor="end" fill="#d7ff43" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">OFFICIAL FRAME</text>
</svg>
