<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Glass Horizon</title>
  <desc id="desc">Electric color refracts in long glass columns above midnight blue.</desc>
  <defs>
    <linearGradient id="rain-a" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00e8ff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#00e8ff"/>
      <stop offset="1" stop-color="#00e8ff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rain-b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff2b9a" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#ff2b9a"/>
      <stop offset="1" stop-color="#ff2b9a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-20%" width="300%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="600" height="900" fill="#080b26"/>
  <g opacity=".32" filter="url(#glow)">
    <rect x="70" y="84" width="20" height="514" fill="#00e8ff"/>
    <rect x="266" y="165" width="28" height="490" fill="#ff2b9a"/>
    <rect x="463" y="74" width="24" height="554" fill="#7f5cff"/>
  </g>
  <g>
    <rect x="54" y="196" width="7" height="366" fill="url(#rain-a)"/>
    <rect x="78" y="94" width="17" height="532" fill="url(#rain-a)"/>
    <rect x="111" y="252" width="5" height="312" fill="url(#rain-b)"/>
    <rect x="137" y="128" width="11" height="486" fill="url(#rain-b)"/>
    <rect x="166" y="74" width="5" height="568" fill="url(#rain-a)"/>
    <rect x="197" y="212" width="18" height="401" fill="url(#rain-a)"/>
    <rect x="232" y="111" width="6" height="517" fill="url(#rain-b)"/>
    <rect x="264" y="176" width="24" height="474" fill="url(#rain-b)"/>
    <rect x="307" y="87" width="8" height="552" fill="url(#rain-a)"/>
    <rect x="336" y="238" width="14" height="346" fill="url(#rain-b)"/>
    <rect x="372" y="132" width="6" height="496" fill="url(#rain-a)"/>
    <rect x="399" y="55" width="19" height="594" fill="url(#rain-b)"/>
    <rect x="442" y="194" width="7" height="416" fill="url(#rain-a)"/>
    <rect x="469" y="78" width="15" height="555" fill="url(#rain-a)"/>
    <rect x="507" y="246" width="6" height="322" fill="url(#rain-b)"/>
    <rect x="534" y="135" width="12" height="489" fill="url(#rain-b)"/>
  </g>
  <circle cx="300" cy="362" r="92" fill="none" stroke="#f4fffd" stroke-width="2" stroke-dasharray="2 10"/>
  <circle cx="300" cy="362" r="12" fill="#f4fffd"/>
  <text x="48" y="62" fill="#00e8ff" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="3">PARALLAX / 03</text>
  <text x="552" y="62" text-anchor="end" fill="#7d83aa" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">MOTION STUDIES 24</text>
  <text x="48" y="735" fill="#f4fffd" font-family="'Cabinet Grotesk', sans-serif" font-size="70" font-weight="700" letter-spacing="-3">GLASS</text>
  <text x="48" y="802" fill="#ff2b9a" font-family="'Cabinet Grotesk', sans-serif" font-size="70" font-weight="700" letter-spacing="-3">HORIZON</text>
  <path d="M48 826H552" stroke="#00e8ff" stroke-opacity=".55"/>
  <text x="48" y="852" fill="#7d83aa" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">THE SKY BECOMES A PRISM</text>
  <text x="552" y="852" text-anchor="end" fill="#00e8ff" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">OFFICIAL FRAME</text>
</svg>
