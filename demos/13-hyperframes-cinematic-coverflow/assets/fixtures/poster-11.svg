<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Last Transmission</title>
  <desc id="desc">Ivory carrier waves rise as luminous columns around a final magenta pulse.</desc>
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ff3eae" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff3eae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="#09090c"/>
  <circle cx="300" cy="378" r="210" fill="url(#pulse)" opacity=".35"/>
  <g fill="#f2ecdd">
    <rect x="68" y="286" width="28" height="254" rx="14"/>
    <rect x="110" y="221" width="28" height="384" rx="14"/>
    <rect x="152" y="170" width="28" height="486" rx="14"/>
    <rect x="194" y="253" width="28" height="320" rx="14"/>
    <rect x="236" y="126" width="28" height="572" rx="14"/>
    <rect x="278" y="205" width="44" height="414" rx="22" fill="#ff3eae"/>
    <rect x="336" y="126" width="28" height="572" rx="14"/>
    <rect x="378" y="253" width="28" height="320" rx="14"/>
    <rect x="420" y="170" width="28" height="486" rx="14"/>
    <rect x="462" y="221" width="28" height="384" rx="14"/>
    <rect x="504" y="286" width="28" height="254" rx="14"/>
  </g>
  <g fill="#09090c">
    <circle cx="82" cy="320" r="7"/><circle cx="124" cy="255" r="7"/>
    <circle cx="166" cy="204" r="7"/><circle cx="208" cy="287" r="7"/>
    <circle cx="250" cy="160" r="7"/><circle cx="300" cy="239" r="10"/>
    <circle cx="350" cy="160" r="7"/><circle cx="392" cy="287" r="7"/>
    <circle cx="434" cy="204" r="7"/><circle cx="476" cy="255" r="7"/>
    <circle cx="518" cy="320" r="7"/>
  </g>
  <text x="48" y="62" fill="#ff3eae" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="3">PARALLAX / 11</text>
  <text x="552" y="62" text-anchor="end" fill="#77727f" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="2">MOTION STUDIES 24</text>
  <text x="48" y="748" fill="#f2ecdd" font-family="'Cabinet Grotesk', sans-serif" font-size="68" font-weight="700" letter-spacing="-4">LAST</text>
  <text x="48" y="812" fill="#ff3eae" font-family="'Cabinet Grotesk', sans-serif" font-size="52" font-weight="700" letter-spacing="-3">TRANSMISSION</text>
  <text x="48" y="855" fill="#77727f" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">ELEVEN WAVES AFTER DARK</text>
  <text x="552" y="855" text-anchor="end" fill="#ff3eae" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2">OFFICIAL FRAME</text>
</svg>
