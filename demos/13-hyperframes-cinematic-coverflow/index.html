      const velocityReadout = document.querySelector("#velocity-readout");
      const positionValue = document.querySelector("#position-value");
      const timeValue = document.querySelector("#time-value");
      const stage = document.querySelector("#coverflow-stage");
      const progressFill = document.querySelector("#progress-fill");
      const lockGlow = document.querySelector("#lock-glow");
      const lockReticle = document.querySelector("#lock-reticle");
      const selectionLock = document.querySelector("#selection-lock");
      const focusVignette = document.querySelector("#focus-vignette");

      function seededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value += 0x6d2b79f5;
          let result = value;
          result = Math.imul(result ^ (result >>> 15), result | 1);
          result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
          return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
        };
      }

      function populateStars(layer, count, seed, sizeScale) {
        const random = seededRandom(seed);
        for (let index = 0; index < count; index += 1) {
          const star = document.createElement("i");
          star.className = "star";
          const size = (0.8 + random() * 2.1) * sizeScale;
          star.style.left = `${random() * 100}%`;
          star.style.top = `${random() * 100}%`;
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.opacity = String(0.28 + random() * 0.62);
          layer.append(star);
        }
      }

      function remainingVelocity(time, center) {
        if (time < TIMING.spinStart) return 100;
        if (time < TIMING.settleStart) {
          const remaining = Math.max(
            0,
            (PRE_SETTLE_CENTER - center) / (PRE_SETTLE_CENTER - START_CENTER),
          );
          return Math.sqrt(remaining) * 100;
        }
        if (time < TIMING.lockStart) {
          const remaining = Math.max(
            0,
            (FINAL_CENTER - center) / (FINAL_CENTER - PRE_SETTLE_CENTER),
          );
          return remaining * 12;
        }
        return 0;
      }

      function renderFrame() {
        const time = clock.time;
        const center = centerAtTime(time);
        const spread = spreadAtTime(time);
        const lock = lockAtTime(time);

        slots.forEach((slot) => {
          const index = Number(slot.dataset.index);
          const layout = coverflowLayout(index, center, spread);
          const card = slot.firstElementChild;
          const isTarget = index === TARGET_INDEX;

          slot.style.transform = `translate3d(${layout.x.toFixed(3)}px, ${layout.y.toFixed(3)}px, ${layout.z.toFixed(3)}px) rotateY(${layout.rotationY.toFixed(3)}deg) scale(${layout.scale.toFixed(4)})`;
          slot.style.opacity = layout.opacity.toFixed(4);
          card.style.setProperty("--brightness", layout.brightness.toFixed(3));
          card.style.setProperty(
            "--dof",
            `${(layout.blur + (isTarget ? 0 : lock * 3)).toFixed(3)}px`,
          );
          card.style.opacity = (isTarget ? 1 : 1 - lock * 0.72).toFixed(4);
          card.style.transform = `scale(${(isTarget ? 1 + lock * 0.08 : 1).toFixed(4)})`;
        });

        const roundedCenter = Math.round(center);
        const posterIndex = positiveMod(roundedCenter, POSTER_COUNT);
        const remainingSpeed = remainingVelocity(time, center);
        centerReadout.textContent = `Center ${String(posterIndex + 1).padStart(2, "0")} / 12`;
        velocityReadout.textContent = `Decel · ${remainingSpeed.toFixed(0).padStart(3, "0")}%`;
        positionValue.textContent = center.toFixed(2).padStart(5, "0");
        timeValue.textContent = time.toFixed(2).padStart(5, "0");
        progressFill.style.transform = `scaleX(${(time / TIMING.duration).toFixed(5)})`;
        stage.style.opacity = visualOpacityAt(time).toFixed(4);
        lockGlow.style.opacity = (lock * 0.78).toFixed(4);
        lockGlow.style.transform = `translate(-50%, -50%) scale(${(0.72 + lock * 0.38).toFixed(4)})`;
        lockReticle.style.opacity = lock.toFixed(4);
        lockReticle.style.transform = `translate(-50%, -50%) scale(${(0.96 + lock * 0.04).toFixed(4)})`;
        selectionLock.style.opacity = lock.toFixed(4);
        selectionLock.style.transform = `translateY(${((1 - lock) * 22).toFixed(3)}px)`;
        focusVignette.style.opacity = lock.toFixed(4);
      }

      populateStars(document.querySelector("#stars-back"), 76, 13013, 0.8);
      populateStars(document.querySelector("#stars-near"), 38, 26026, 1.25);

      for (const crossing of buildCrossingTimes()) {
        const marker = document.createElement("i");
        marker.style.left = `${(crossing.time / TIMING.duration) * 100}%`;
        marker.style.height = crossing.final ? "20px" : "12px";
        marker.style.top = crossing.final ? "5px" : "9px";
        marker.style.background = crossing.final ? "var(--accent, #e6b860)" : "rgba(237, 220, 188, 0.5)";
        document.querySelector("#beat-rail").append(marker);
      }

      renderFrame();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      tl.addLabel("assemble", TIMING.assembleStart);
      tl.addLabel("spin", TIMING.spinStart);
      tl.addLabel("settle", TIMING.settleStart);
      tl.addLabel("lock", TIMING.lockStart);
      tl.addLabel("exit", TIMING.exitStart);

      tl.fromTo("#masthead", { y: -28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 0.16);
      tl.fromTo("#transport", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.62, ease: "power2.out" }, 0.22);
      tl.fromTo(".frame-corner", { opacity: 0 }, { opacity: 1, duration: 0.72, ease: "sine.out" }, 0.12);
      tl.fromTo("#center-axis", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 0.44, duration: 0.74, ease: "power4.out", transformOrigin: "center center" }, 0.2);

      tl.to(clock, { time: TIMING.duration, duration: TIMING.duration, ease: "none", onUpdate: renderFrame }, 0);

      tl.fromTo("#stars-back", { x: -14, y: -6 }, { x: 18, y: 8, duration: 9.12, ease: "sine.inOut" }, "assemble");
      tl.fromTo("#stars-near", { x: 16, y: 7 }, { x: -22, y: -9, duration: 9.12, ease: "power1.inOut" }, "assemble");
      tl.fromTo("#nebula", { x: -12, scale: 1 }, { x: 20, scale: 1.05, duration: 9.12, ease: "sine.inOut" }, "assemble");

      window.__timelines.main = tl;
    </script>
  </body>
</html>
